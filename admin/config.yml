        fields:
          - { label: "사진 목록 (순서대로)", name: "photos", widget: "list", field: { label: "사진", name: "src", widget: "image" } }
  - name: "gallery_living_manifest"
    label: "시공 갤러리 - 거실"
    files:
      - file: "uploads/gallery-living-manifest.json"
        label: "거실 사진 목록"
        name: "gallery_living_manifest"
        fields:
          - label: "사진 목록 (순서대로)"
            name: "photos"
            widget: "list"
            fields:
              - { label: "사진", name: "src", widget: "image" }
              - { label: "설치 제품", name: "product", widget: "string", required: false }
              - { label: "설명", name: "description", widget: "text", required: false }
