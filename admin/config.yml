backend:
  name: git-gateway
  repo: meilanz83-rgb/Chamblinds-site1
  branch: main
  auth_type: implicit
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/05e04ccb-a6fc-4e2b-bf58-6f735e3bde8e/pkce
  auth_token_endpoint: /sites/05e04ccb-a6fc-4e2b-bf58-6f735e3bde8e/token
  gateway_url: https://gateway.decapbridge.com

media_folder: "uploads/롤스크린"
public_folder: "/uploads/롤스크린"

collections:
  - name: "roll_manifest"
    label: "롤스크린 카탈로그 사진"
    files:
      - file: "uploads/roll-manifest.json"
        label: "롤스크린 사진 목록"
        name: "roll_manifest"
        fields:
          - { label: "사진 목록 (순서대로)", name: "photos", widget: "list", field: { label: "사진", name: "src", widget: "image" } }
  - name: "combi_manifest"
    label: "콤비블라인드 카탈로그 사진"
    files:
      - file: "uploads/combi-manifest.json"
        label: "콤비블라인드 사진 목록"
        name: "combi_manifest"
        fields:
          - { label: "사진 목록 (순서대로)", name: "photos", widget: "list", field: { label: "사진", name: "src", widget: "image" } }
  - name: "wood_manifest"
    label: "우드블라인드 카탈로그 사진"
    files:
      - file: "uploads/wood-manifest.json"
        label: "우드블라인드 사진 목록"
        name: "wood_manifest"
        fields:
          - { label: "사진 목록 (순서대로)", name: "photos", widget: "list", field: { label: "사진", name: "src", widget: "image" } }
  - name: "honeycomb_manifest"
    label: "허니콤쉐이드 카탈로그 사진"
    files:
      - file: "uploads/honeycomb-manifest.json"
        label: "허니콤쉐이드 사진 목록"
        name: "honeycomb_manifest"
        fields:
          - { label: "사진 목록 (순서대로)", name: "photos", widget: "list", field: { label: "사진", name: "src", widget: "image" } }
  - name: "vertical_manifest"
    label: "버티컬 카탈로그 사진"
    files:
      - file: "uploads/vertical-manifest.json"
        label: "버티컬 사진 목록"
        name: "vertical_manifest"
        fields:
          - { label: "사진 목록 (순서대로)", name: "photos", widget: "list", field: { label: "사진", name: "src", widget: "image" } }
  - name: "curtain_manifest"
    label: "커튼 카탈로그 사진"
    files:
      - file: "uploads/curtain-manifest.json"
        label: "커튼 사진 목록"
        name: "curtain_manifest"
        fields:
          - { label: "사진 목록 (순서대로)", name: "photos", widget: "list", field: { label: "사진", name: "src", widget: "image" } }
  - name: "gallery_pension_manifest"
    label: "시공 갤러리 - 펜션"
    files:
      - file: "uploads/gallery-pension-manifest.json"
        label: "펜션 사진 목록"
        name: "gallery_pension_manifest"
        fields:
          - label: "사진 목록 (순서대로)"
            name: "photos"
            widget: "list"
            fields:
              - { label: "사진", name: "src", widget: "image", required: true }
              - { label: "제목", name: "title", widget: "string", required: false }
              - { label: "설치 제품", name: "product", widget: "string", required: false }
              - { label: "요약 (목록에 짧게 보일 설명)", name: "description", widget: "text", required: false }
              - { label: "본문 (사진 아래 블로그처럼 자세히 쓰는 글)", name: "content", widget: "text", required: false }
  - name: "gallery_apartment_manifest"
    label: "시공 갤러리 - 아파트"
    files:
      - file: "uploads/gallery-apartment-manifest.json"
        label: "아파트 사진 목록"
        name: "gallery_apartment_manifest"
        fields:
          - label: "사진 목록 (순서대로)"
            name: "photos"
            widget: "list"
            fields:
              - { label: "사진", name: "src", widget: "image", required: true }
              - { label: "제목", name: "title", widget: "string", required: false }
              - { label: "설치 제품", name: "product", widget: "string", required: false }
              - { label: "요약 (목록에 짧게 보일 설명)", name: "description", widget: "text", required: false }
              - { label: "본문 (사진 아래 블로그처럼 자세히 쓰는 글)", name: "content", widget: "text", required: false }
  - name: "gallery_countryhouse_manifest"
    label: "시공 갤러리 - 전원주택"
    files:
      - file: "uploads/gallery-countryhouse-manifest.json"
        label: "전원주택 사진 목록"
        name: "gallery_countryhouse_manifest"
        fields:
          - label: "사진 목록 (순서대로)"
            name: "photos"
            widget: "list"
            fields:
              - { label: "사진", name: "src", widget: "image", required: true }
              - { label: "제목", name: "title", widget: "string", required: false }
              - { label: "설치 제품", name: "product", widget: "string", required: false }
              - { label: "요약 (목록에 짧게 보일 설명)", name: "description", widget: "text", required: false }
              - { label: "본문 (사진 아래 블로그처럼 자세히 쓰는 글)", name: "content", widget: "text", required: false }
  - name: "gallery_cafe_manifest"
    label: "시공 갤러리 - 카페"
    files:
      - file: "uploads/gallery-cafe-manifest.json"
        label: "카페 사진 목록"
        name: "gallery_cafe_manifest"
        fields:
          - label: "사진 목록 (순서대로)"
            name: "photos"
            widget: "list"
            fields:
              - { label: "사진", name: "src", widget: "image", required: true }
              - { label: "제목", name: "title", widget: "string", required: false }
              - { label: "설치 제품", name: "product", widget: "string", required: false }
              - { label: "요약 (목록에 짧게 보일 설명)", name: "description", widget: "text", required: false }
              - { label: "본문 (사진 아래 블로그처럼 자세히 쓰는 글)", name: "content", widget: "text", required: false }
