backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
  branch: main
  base_url: https://www.decapbridge.com
  auth_endpoint: api/auth

media_folder: "uploads/롤스크린"
public_folder: "/uploads/롤스크린"

collections:
  - name: "roll_manifest"
    label: "롤스크린 카탈로그 사진"
    files:
      - file: "uploads/roll-manifest.json"
        label: "롤스크린 사진 목록"
        name: "roll_manifest"
        fields:
          - { label: "사진 목록 (순서대로)", name: "photos", widget: "list", field: { label: "사진", name: "src", widget: "image" } }
  - name: "combi_manifest"
    label: "콤비블라인드 카탈로그 사진"
